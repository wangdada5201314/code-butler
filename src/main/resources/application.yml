# ============================================================
# Code Butler — 应用主配置（提交 Git）
# 
# 层级：application.yml → application-local.yml → 环境变量
# 
# 敏感信息（数据库密码、API Key）请在 application-local.yml 中配置，
# 该文件已加入 .gitignore，不会提交到仓库。
# ============================================================

server:
  port: 8080
  shutdown: graceful                       # 优雅关闭（等待正在处理的请求完成）
  servlet:
    session:
      cookie:
        http-only: true                  # 防止 XSS 窃取 Cookie
        secure: false                    # 本地开发 HTTP，生产环境改为 true
        same-site: lax

spring:
  application:
    name: code-butler
  lifecycle:
    timeout-per-shutdown-phase: 30s        # 优雅关闭等待时间（SSE 流式请求最长 120s+30s 缓冲）
  # 默认激活 local profile → 自动合并 application-local.yml
  profiles:
    active: local

  # ── Session ──
  session:
    store-type: redis
    timeout: 2592000                     # 30 天

  # ── Redis（实际值在 application-local.yml）──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

  # ── MySQL（实际值在 application-local.yml）──
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/code_butler}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池基础配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 空闲检测
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # 连接有效性检测
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 过滤器
      filters: stat,wall,slf4j
      # StatViewServlet 监控页面（默认禁用，本地开发可在 application-local.yml 开启）
      stat-view-servlet:
        enabled: ${DRUID_MONITOR_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:}
        login-password: ${DRUID_PASSWORD:}
      # WebStatFilter 监控
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # 连接池状态过滤器
      filter:
        stat:
          slow-sql-millis: 3000
          log-slow-sql: true
        wall:
          enabled: true

# ── MyBatis-Flex ──
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

# ── CORS ──
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── AgentScope ──
agentscope:
  model:
    default: ${AGENTSCOPE_MODEL:openai:deepseek-chat}
    fallback: ${AGENTSCOPE_FALLBACK_MODEL:}    # 备用模型（主模型超时/限流时自动切换）
    max-retries: ${AGENTSCOPE_MAX_RETRIES:3}   # 主模型最大重试次数
  call-timeout-seconds: 120
  workspace:
    path: .agentscope/workspace
  compaction:
    trigger-messages: 30
    keep-messages: 10
  state:
    cleanup-on-start: ${AGENTSCOPE_CLEANUP_ON_START:false}

# ── API Key（优先级：环境变量 > application-local.yml > 此处占位符）──
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

# Embedding 向量化配置（RAG 使用）
# 支持任意 OpenAI 兼容的 Embedding API（DashScope / DeepSeek / OpenAI 等）
# 不配置时自动 fallback: embedding.* > dashscope.* > openai.*
embedding:
  api-url: ${EMBEDDING_API_URL:}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:text-embedding-v3}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:}

# ── Git ──
git:
  command-timeout-seconds: 30

# ── 安全 ──
app:
  security:
    # ⚠️ 生产环境务必通过 APP_PASSWORD_SALT 环境变量设置独立盐值
    password-salt: ${APP_PASSWORD_SALT:code-butler}

# ── GitHub ──
github:
  token: ${GITHUB_TOKEN:}

# ── 用量配额 ──
quota:
  review:
    daily-limit: ${QUOTA_REVIEW_DAILY:20}
  chat:
    daily-limit: ${QUOTA_CHAT_DAILY:50}
  doc:
    daily-limit: ${QUOTA_DOC_DAILY:20}

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── 日志（生产级别；本地开发可在 application-local.yml 覆盖为 DEBUG）──
logging:
  level:
    root: info
    com.agent.codebutler: info
