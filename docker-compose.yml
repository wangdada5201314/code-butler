services:
  redis:
    image: redis:7-alpine
    container_name: code-butler-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: code-butler-mysql
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect='SET NAMES utf8mb4'
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: code_butler
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01_create_table.sql
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:
